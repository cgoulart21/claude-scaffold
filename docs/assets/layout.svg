<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" role="img"
     aria-label="Machine layout: knowledge lives in version-controlled repositories on the left, configuration lives in the agent home on the right, and per-directory memory silos are junctions into the single store.">
  <style>
    .g { fill: none; stroke: currentColor; }
    text { fill: currentColor; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 12.5px; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
    .note { font-size: 11.5px; opacity: 0.72; }
    .col { stroke-width: 1; opacity: 0.35; }
    .box { stroke-width: 1.25; opacity: 0.55; }
    .link { stroke-width: 1.5; stroke-dasharray: 5 4; opacity: 0.8; }
    .head { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; opacity: 0.75; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity="0.8"/>
    </marker>
  </defs>

  <text class="head" x="24" y="28">VERSION CONTROLLED &#8212; your knowledge</text>
  <text class="head" x="448" y="28">APPLICATION STATE &#8212; not backed up</text>

  <rect class="g col" x="16" y="40" width="392" height="400" rx="8"/>
  <rect class="g col" x="440" y="40" width="324" height="400" rx="8"/>

  <text class="title" x="32" y="66">C:\Projects\</text>

  <rect class="g box" x="32" y="80" width="170" height="52" rx="6"/>
  <text class="mono" x="44" y="101">my-project-a\</text>
  <text class="mono" x="44" y="120">my-project-b\</text>

  <rect class="g box" x="32" y="148" width="360" height="164" rx="6"/>
  <text class="mono" x="44" y="170">my-config\</text>
  <text class="note" x="128" y="170">private repository</text>
  <rect class="g box" x="52" y="182" width="200" height="60" rx="5"/>
  <text class="mono" x="64" y="202">memory\</text>
  <text class="mono" x="64" y="221">  MEMORY.md</text>
  <text class="note" x="262" y="207">the one physical store</text>
  <text class="mono" x="64" y="264">LESSONS.md</text>
  <text class="mono" x="64" y="288">corrections\log.md</text>

  <rect class="g box" x="32" y="328" width="360" height="52" rx="6"/>
  <text class="mono" x="44" y="349">my-vault\</text>
  <text class="note" x="44" y="368">optional knowledge wiki, its own repository</text>

  <text class="title" x="456" y="66">&lt;AGENT-HOME&gt;\</text>

  <rect class="g box" x="456" y="80" width="292" height="96" rx="6"/>
  <text class="mono" x="468" y="101">CLAUDE.md</text>
  <text class="mono" x="468" y="120">settings.json</text>
  <text class="mono" x="468" y="139">hooks\</text>
  <text class="mono" x="468" y="158">skills\  maintenance\</text>

  <rect class="g box" x="456" y="192" width="292" height="120" rx="6"/>
  <text class="mono" x="468" y="213">projects\</text>
  <text class="mono" x="468" y="236">  &lt;dir-a&gt;\memory</text>
  <text class="mono" x="468" y="259">  &lt;dir-b&gt;\memory</text>
  <text class="mono" x="468" y="282">  &lt;dir-c&gt;\memory</text>
  <text class="note" x="614" y="213">per-directory silos</text>

  <path class="g link" d="M 456 236 C 420 236, 300 212, 254 212" marker-end="url(#arrow)"/>
  <path class="g link" d="M 456 259 C 410 259, 300 216, 254 216" marker-end="url(#arrow)"/>
  <path class="g link" d="M 456 282 C 400 282, 300 220, 254 220" marker-end="url(#arrow)"/>
  <text class="note" x="300" y="318">junctions &#8594; one store</text>

  <text class="label" x="24" y="470">Knowledge on the left: it has a history, it survives a reinstall, and you chose where it lives.</text>
  <text class="label" x="24" y="492">Configuration on the right: the application owns it, updates rewrite it, nothing there is backed up.</text>
  <text class="note" x="24" y="512">A fact written from any project lands in the one store, and every session reads all of it.</text>
</svg>
